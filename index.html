<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приключения с часами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen active">
            <h1>Учимся определять время!</h1>
            <div class="stars-display">Мои звёзды: <span id="total-stars">0</span>⭐</div>
            <button id="btn-start" class="btn primary">Играть</button>
            <button id="btn-reset" class="btn secondary">Сбросить прогресс</button>
        </div>

        <!-- Level Map / Selection -->
        <div id="map-screen" class="screen">
            <h2>Карта приключений</h2>
            <div class="stars-display">Мои звёзды: <span id="map-stars">0</span>⭐</div>
            <div id="levels-container" class="levels-grid"></div>
            <button id="btn-back-menu" class="btn secondary">На главную</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <span class="level-info">Уровень <span id="current-level-num">1</span></span>
                <button id="btn-back-map" class="btn small">Назад</button>
            </div>
            
            <div id="question-container">
                <h2 id="question-text">Вопрос</h2>
                <p id="hint-text" class="hidden"></p>
            </div>

            <div class="clock-area">
                <div id="clock-container"></div>
                <div id="read-time-options" class="options-grid hidden">
                    <!-- Buttons for read time logic -->
                </div>
            </div>

            <div class="actions-area">
                <button id="btn-check" class="btn primary">Проверить</button>
                <button id="btn-hint" class="btn secondary">Подсказка</button>
            </div>

            <div id="feedback-overlay" class="overlay hidden">
                <div class="feedback-box">
                    <h2 id="feedback-title">Молодец!</h2>
                    <p id="feedback-stars">⭐⭐⭐</p>
                    <button id="btn-next" class="btn primary">Дальше</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
